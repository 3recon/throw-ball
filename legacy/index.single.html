<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>패배 분풀이 야구 ⚾ | 진 날의 스트레스 해소 게임</title>
<meta name="description" content="응원팀이 진 날, 투수가 되어 야구공·배트·치킨·맥주병을 던지며 분풀이하는 웹 3D 게임. KBO 팬을 위한 스트레스 해소용 미니게임.">
<meta name="theme-color" content="#0b1220">
<meta property="og:type" content="website">
<meta property="og:title" content="패배 분풀이 야구 ⚾">
<meta property="og:description" content="응원팀이 진 날, 공을 던지며 분풀이하는 웹 3D 게임. 오늘 졌다면 60초 동안 던져보세요.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>⚾</text></svg>">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;user-select:none;-webkit-user-select:none}
  canvas{display:block;touch-action:none;cursor:none}
  #hud{position:fixed;top:12px;left:12px;right:12px;display:none;justify-content:space-between;gap:8px;pointer-events:none}
  .chip{background:#0009;color:#fff;font-weight:800;padding:8px 14px;border-radius:12px;font-size:16px;backdrop-filter:blur(4px)}
  .chip b{color:#fde047}
  #powerWrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
  #powerLabel{color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 3px #000}
  #power{width:260px;height:14px;background:#0008;border:2px solid #fff;border-radius:9px;overflow:hidden}
  #powerFill{height:100%;width:0;background:linear-gradient(90deg,#4ade80,#facc15,#ef4444)}
  #reticle{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #0006;pointer-events:none;display:none}
  #reticle::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#ef4444;border-radius:50%}
  .float{position:fixed;transform:translate(-50%,-100%);pointer-events:none;font-weight:900;white-space:nowrap}
  .pts{color:#fde047;font-size:24px;text-shadow:0 2px 0 #000,0 0 8px #000}
  .pow{color:#fff;font-size:30px;font-style:italic;text-shadow:0 3px 0 #dc2626,0 0 10px #000}
  .bubble{background:#fff;color:#111;font-size:13px;font-weight:700;padding:5px 9px;border-radius:10px;box-shadow:0 2px 6px #0005}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
  #comboMsg{position:fixed;top:24%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:44px;font-weight:900;text-shadow:0 3px 0 #b91c1c,0 0 18px #000;pointer-events:none;opacity:0;transition:opacity .25s}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0b1220aa,#0b1220ee);z-index:10}
  .card{background:#111827;color:#f9fafb;border:1px solid #374151;border-radius:20px;padding:28px 30px;width:min(420px,88vw);text-align:center;box-shadow:0 20px 50px #000a}
  .card h1{margin:0 0 6px;font-size:26px}
  .card p{margin:6px 0 16px;color:#9ca3af;font-size:14px;line-height:1.5}
  .swatches{display:flex;justify-content:center;gap:10px;margin:8px 0 20px;flex-wrap:wrap}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px #fde047}
  .hero-emoji{font-size:54px;line-height:1;margin-bottom:6px}
  .card h2{margin:0 0 4px;font-size:15px;color:#cbd5e1;font-weight:700}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 18px;max-height:min(46vh,340px);overflow:auto}
  .team{display:flex;align-items:center;gap:9px;background:#1f2937;border:2px solid transparent;border-radius:12px;padding:10px 11px;cursor:pointer;color:#e5e7eb;font-weight:800;font-size:14px;text-align:left;transition:background .12s}
  .team:hover{background:#273244}
  .team.on{border-color:#fde047;background:#2b3750}
  .team .dot{width:15px;height:15px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px #0005}
  .steps{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .steps i{width:7px;height:7px;border-radius:50%;background:#374151}
  .steps i.on{background:#fde047}
  .primary{background:#fde047;color:#1a1a1a}
  .ghost{background:transparent;color:#9ca3af;border:1px solid #374151}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
  .lose{background:#ef4444;color:#fff}
  .win{background:#374151;color:#e5e7eb}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 20px}
  .stat{background:#1f2937;border-radius:12px;padding:10px}
  .stat div:first-child{font-size:12px;color:#9ca3af}
  .stat div:last-child{font-size:22px;font-weight:900}
  .small{font-size:12px;color:#6b7280;margin-top:14px}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud">
  <div class="chip">⏱ <b id="time">60</b>초</div>
  <div class="chip">점수 <b id="score">0</b></div>
  <div class="chip">명중 <b id="acc">0/0</b></div>
  <div class="chip">콤보 <b id="combo">0</b></div>
</div>
<div id="powerWrap"><div id="powerLabel">꾹 눌러 와인드업 → 떼면 투구 · 세게 던질수록 못 피함</div><div id="power"><div id="powerFill"></div></div></div>
<div id="reticle"></div>
<div id="comboMsg"></div>
<div id="overlay"><div class="card"><h1>⚾ 불러오는 중…</h1></div></div>

<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

const V3 = THREE.Vector3;
const G = 9.8, BALL_R = 0.1, ROUND_TIME = 60;
const PLATE_Z = -14;
const BOUNDS = { x0: -6.5, x1: 6.5, z0: -18.5, z1: -10 };
// KBO 10개 구단 (구단명 + 대표색). 로고·유니폼·실제 선수는 사용하지 않음.
const TEAMS = [
  { name: '두산 베어스',   color: '#131230' },
  { name: 'LG 트윈스',     color: '#c30452' },
  { name: 'KIA 타이거즈',  color: '#ea0029' },
  { name: '삼성 라이온즈', color: '#074ca1' },
  { name: '롯데 자이언츠', color: '#041e42' },
  { name: '한화 이글스',   color: '#fc4e00' },
  { name: 'SSG 랜더스',    color: '#ce0e2d' },
  { name: 'KT 위즈',       color: '#2a2a2a' },
  { name: 'NC 다이노스',   color: '#315288' },
  { name: '키움 히어로즈', color: '#570514' },
];
const COLORS = TEAMS.map(t => t.color);
const SKINS = [0xf1c9a0, 0xe0ac7e, 0xc98b5e, 0xf5d3b3];
const IDLE_LINES = ['죄송합니다…','다음엔 이길게요!','오늘 컨디션이…','심판이 문제였어요','팬 여러분 사랑해요'];
const DODGE_LINES = ['휴~','안 맞았지롱','피했다!','어림없지'];
const PANIC_LINES = ['으악!','엄마!','잠깐만!'];
const HIT_LINES = ['아야!','반성할게요…','잘못했어요!','으윽…'];
const pick = a => a[Math.floor(Math.random()*a.length)];
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,k) => a + (b-a)*k;
const wrapAng = a => Math.atan2(Math.sin(a), Math.cos(a));
const lerpAng = (a,b,k) => a + wrapAng(b-a)*k;

// ================= 렌더러 =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const effect = new OutlineEffect(renderer, { defaultThickness: 0.0045, defaultColor: [0.07, 0.07, 0.1] });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 400);
const CAM_BASE = new V3(1.9, 3.3, 4.8);
const CAM_LOOK = new V3(0, 1.0, PLATE_Z + 1);
camera.position.copy(CAM_BASE); camera.lookAt(CAM_LOOK);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const noOutline = m => { m.userData.outlineParameters = { visible: false }; return m; };
const lam = (o) => noOutline(new THREE.MeshLambertMaterial(o));

// 하늘
scene.background = canvasTex(4, 512, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#2f6fb8'); g.addColorStop(0.55, '#8cc4ec'); g.addColorStop(1, '#f6e3c4');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
});
scene.fog = new THREE.Fog(0xcfe3f2, 70, 160);

scene.add(new THREE.HemisphereLight(0xffffff, 0x5a7a40, 1.3));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(-9, 20, 6);
sun.target.position.set(0, 0, -8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
scene.add(sun, sun.target);

// ================= 경기장 =================
const grassTex = canvasTex(256, 256, (x, w, h) => {
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { x.fillStyle = (i + j) % 2 ? '#4f9a3e' : '#5aa847'; x.fillRect(i*w/8, j*h/8, w/8, h/8); }
});
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(9, 9);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(360, 360), lam({ map: grassTex }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

const dirtMat = lam({ color: 0xc58c5a });
function flat(geo, mat, x, y, z, ry = 0) { const m = new THREE.Mesh(geo, mat); m.rotation.set(-Math.PI/2, 0, ry); m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m; }
flat(new THREE.CircleGeometry(4.6, 48), dirtMat, 0, 0.012, PLATE_Z);
const mound = new THREE.Mesh(new THREE.CylinderGeometry(2.7, 3.0, 0.25, 48), dirtMat); mound.position.set(0, 0.125, 0); mound.receiveShadow = true; scene.add(mound);
const white = lam({ color: 0xffffff });
const rubber = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.03, 0.15), white); rubber.position.set(0, 0.26, 0.3); scene.add(rubber);
// 홈플레이트
{ const s = new THREE.Shape(); s.moveTo(-0.22,0); s.lineTo(0.22,0); s.lineTo(0.22,-0.22); s.lineTo(0,-0.44); s.lineTo(-0.22,-0.22); s.closePath();
  const m = flat(new THREE.ShapeGeometry(s), white, 0, 0.02, PLATE_Z + 0.2); m.rotation.z = Math.PI; }
// 파울라인 + 베이스 라인 흙
for (const sgn of [1, -1]) {
  const dir = new V3(sgn, 0, 1).normalize(), ang = Math.atan2(dir.x, dir.z);
  const path = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 21), dirtMat);
  path.rotation.set(-Math.PI/2, 0, ang); path.position.set(dir.x*10.5, 0.011, PLATE_Z + dir.z*10.5); path.receiveShadow = true; scene.add(path);
  const line = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 80), white);
  line.rotation.set(-Math.PI/2, 0, ang); line.position.set(dir.x*40, 0.016, PLATE_Z + dir.z*40); scene.add(line);
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.4), white); base.position.set(dir.x*20.5, 0.04, PLATE_Z + dir.z*20.5); base.rotation.y = Math.PI/4; scene.add(base);
  // 타석
  const box = new THREE.Mesh(new THREE.RingGeometry(0, 1, 4), white);
  const frame = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1.1, 1.8)), new THREE.LineBasicMaterial({ color: 0xffffff }));
  frame.rotation.x = -Math.PI/2; frame.position.set(sgn*0.95, 0.02, PLATE_Z); scene.add(frame);
}

// 관중석 (응원팀 색 관중)
let crowdTextures = [], standAccent = [];
const STAND_TH = Math.PI - 1.3, STAND_LEN = 2.6;
const standGroup = new THREE.Group(); scene.add(standGroup);
function makeCrowdTex(team) {
  return canvasTex(1024, 96, (x, w, h) => {
    x.fillStyle = '#39404d'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#2a2f3a'; x.fillRect(0, h/2 - 6, w, 6); x.fillRect(0, h - 10, w, 10);
    for (let px = 4; px < w; px += 12 + Math.random()*4) {
      if (Math.random() < 0.1) continue;
      for (const row of [0, 1]) {
        if (Math.random() < 0.1) continue;
        const r = Math.random(), col = r < 0.62 ? team : r < 0.8 ? '#ffffff' : pick(['#facc15','#111827','#9ca3af','#f97316']);
        const by = (row ? h - 8 : h/2 - 4) - rand(0, 4), bh = 18, ox = px + (row ? 6 : 0);
        x.fillStyle = col; x.fillRect(ox, by - bh, 9, bh);
        if (Math.random() < 0.15) { x.fillRect(ox - 2, by - bh - 10, 3, 10); x.fillRect(ox + 8, by - bh - 10, 3, 10); }
        x.fillStyle = pick(['#f1c9a0','#e0ac7e','#c98b5e','#2b2118']); x.beginPath(); x.arc(ox + 4.5, by - bh - 4, 4.5, 0, 7); x.fill();
      }
    }
  });
}
const adTex = canvasTex(2048, 128, (x, w, h) => {
  const ads = [['#0f172a','분풀이 스포츠'],['#b91c1c','ANGRY FAN'],['#065f46','시원한 음료'],['#1e3a8a','멘탈 회복 센터'],['#7c2d12','치킨은 이길 때도 질 때도']];
  for (let i = 0; i < 10; i++) { const [bg, t] = ads[i % ads.length]; x.fillStyle = bg; x.fillRect(i*w/10, 0, w/10, h); x.fillStyle = '#fff'; x.font = 'bold 30px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t, i*w/10 + w/20, h/2); }
});
adTex.wrapS = THREE.RepeatWrapping; adTex.repeat.set(-2, 1);
function buildStands(team) {
  while (standGroup.children.length) standGroup.remove(standGroup.children[0]);
  crowdTextures = []; standAccent = [];
  const base = makeCrowdTex(team);
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(9.6, 9.6, 2.4, 64, 1, true, STAND_TH, STAND_LEN), lam({ map: adTex, side: THREE.DoubleSide }));
  wall.position.set(0, 1.2, PLATE_Z); standGroup.add(wall);
  let y = 2.4, R = 9.6;
  const stepMat = lam({ color: 0x8b93a1, side: THREE.DoubleSide });
  for (let i = 0; i < 11; i++) {
    const top = new THREE.Mesh(new THREE.RingGeometry(R, R + 1.3, 64, 1, STAND_TH - Math.PI/2, STAND_LEN), stepMat);
    top.rotation.x = -Math.PI/2; top.position.set(0, y, PLATE_Z); standGroup.add(top);
    R += 1.3;
    const t = base.clone(); t.wrapS = THREE.RepeatWrapping; t.repeat.set(-R*STAND_LEN/22, 1); t.offset.x = Math.random(); t.needsUpdate = true; crowdTextures.push(t);
    const riser = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.8, 72, 1, true, STAND_TH, STAND_LEN), lam({ map: t, side: THREE.DoubleSide }));
    riser.position.set(0, y + 0.4, PLATE_Z); standGroup.add(riser);
    y += 0.8;
  }
  const rimMat = lam({ color: new THREE.Color(team).multiplyScalar(0.8), side: THREE.DoubleSide }); standAccent.push(rimMat);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.2, R + 0.2, 2.2, 72, 1, true, STAND_TH, STAND_LEN), rimMat);
  rim.position.set(0, y + 1.1, PLATE_Z); standGroup.add(rim);
  const roof = new THREE.Mesh(new THREE.RingGeometry(R - 6, R + 0.2, 64, 1, STAND_TH - Math.PI/2, STAND_LEN), lam({ color: 0xe5e7eb, side: THREE.DoubleSide }));
  roof.rotation.x = -Math.PI/2; roof.position.set(0, y + 2.2, PLATE_Z); standGroup.add(roof);
}
// 조명탑
for (const sgn of [1, -1]) {
  const a = Math.PI - sgn*1.45, x = Math.sin(a)*33, z = PLATE_Z + Math.cos(a)*33;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.6, 30, 10), lam({ color: 0x6b7280 })); pole.position.set(x, 15, z); scene.add(pole);
  const panelTex = canvasTex(256, 160, (c, w, h) => { c.fillStyle = '#374151'; c.fillRect(0, 0, w, h); for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) { c.fillStyle = '#fffbe6'; c.fillRect(12 + i*40, 12 + j*37, 32, 28); } });
  const panel = new THREE.Mesh(new THREE.BoxGeometry(7, 4.2, 0.6), [lam({ color: 0x374151 }), lam({ color: 0x374151 }), lam({ color: 0x374151 }), lam({ color: 0x374151 }), noOutline(new THREE.MeshBasicMaterial({ map: panelTex })), lam({ color: 0x374151 })]);
  panel.position.set(x, 31, z); panel.lookAt(0, 0, PLATE_Z + 4); scene.add(panel);
}
// 전광판
const boardCanvas = document.createElement('canvas'); boardCanvas.width = 768; boardCanvas.height = 288;
const boardTex = new THREE.CanvasTexture(boardCanvas); boardTex.colorSpace = THREE.SRGBColorSpace;
const board = new THREE.Group();
const bframe = new THREE.Mesh(new THREE.BoxGeometry(15, 6.2, 0.8), lam({ color: 0x1f2937 })); board.add(bframe);
const bscreen = new THREE.Mesh(new THREE.PlaneGeometry(14.2, 5.4), noOutline(new THREE.MeshBasicMaterial({ map: boardTex }))); bscreen.position.z = 0.41; board.add(bscreen);
const bleg = new THREE.Mesh(new THREE.BoxGeometry(1, 6, 0.6), lam({ color: 0x4b5563 })); bleg.position.y = -5.5; board.add(bleg);
board.position.set(0, 23, PLATE_Z - 30); scene.add(board);
let boardMsg = '오늘 패배… 분풀이 준비', boardDirty = true;
function drawBoard() {
  const x = boardCanvas.getContext('2d'), w = 768, h = 288;
  x.fillStyle = '#05070c'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#111827'; for (let i = 0; i < w; i += 6) x.fillRect(i, 0, 1, h);
  x.font = 'bold 34px sans-serif'; x.fillStyle = '#fbbf24'; x.textAlign = 'left'; x.fillText('분풀이 전광판', 24, 48);
  x.textAlign = 'right'; x.fillStyle = '#f87171'; x.fillText('⏱ ' + Math.ceil(timeLeft), w - 24, 48);
  x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = 'bold 96px sans-serif'; x.fillText(score, w/2, 150);
  x.font = 'bold 30px sans-serif'; x.fillStyle = '#93c5fd'; x.fillText(`명중 ${hits}/${throws}   ·   콤보 ${combo}`, w/2, 200);
  x.fillStyle = '#fde047'; x.font = 'bold 34px sans-serif'; x.fillText(boardMsg, w/2, 258);
  boardTex.needsUpdate = true; boardDirty = false;
}

// ================= 캐릭터 (관절 뼈대) =================
const gradMap = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter; gradMap.needsUpdate = true;
const toon = (c, extra = {}) => new THREE.MeshToonMaterial({ color: c, gradientMap: gradMap, ...extra });
const GEO = {};
const capG = (r, l) => GEO['c' + r + l] ||= new THREE.CapsuleGeometry(r, l, 5, 12);
const sphG = () => GEO.s ||= new THREE.SphereGeometry(1, 18, 14);
const cylG = () => GEO.cy ||= new THREE.CylinderGeometry(1, 1, 1, 18);
const domeG = () => GEO.dome ||= new THREE.SphereGeometry(0.124, 20, 10, 0, Math.PI*2, 0, Math.PI/2);

    case 'dodge':
      if (pl.t < 0.42) pos.addScaledVector(pl.vel, dt*(1 - pl.t/0.5));
      if (pl.t > 0.62) { if (Math.random() < 0.5) say(pl, pick(DODGE_LINES)); toIdle(pl); }
      break;
    case 'duck': if (pl.t > 0.8) { if (Math.random() < 0.5) say(pl, pick(DODGE_LINES)); toIdle(pl); } break;
    case 'panic': if (pl.t > 0.75) toIdle(pl); break;
    case 'down':
      turn = false; pos.addScaledVector(pl.knock, dt); pl.knock.multiplyScalar(Math.exp(-dt*4));
      if (!pl.dustDone && pl.t > 0.42) { pl.dustDone = true; dust(pl.rig.b.hips.getWorldPosition(new V3()).setY(0), 7, 0.9); }
      if (pl.t > 2.0) { pl.state = 'getup'; pl.t = 0; pl.anim.play('getup', { fade: 0.1 }); }
      break;
    case 'getup': turn = false; if (pl.t > 1.15) toIdle(pl); break;
  }
  pos.x = clamp(pos.x, BOUNDS.x0 - 2, BOUNDS.x1 + 2); pos.z = clamp(pos.z, BOUNDS.z0 - 2, BOUNDS.z1 + 1.5);
  if (turn) root.rotation.y = lerpAng(root.rotation.y, faceYaw, 1 - Math.exp(-dt*7));
  pl.anim.update(dt);
  // 날아오는 공을 고개로 따라보기
  let look = 0;
  if (['idle', 'taunt', 'react', 'panic'].includes(pl.state)) {
    const b = balls.find(b => !b.resolved);
    if (b) look = clamp(wrapAng(Math.atan2(b.mesh.position.x - pos.x, b.mesh.position.z - pos.z) - root.rotation.y), -0.9, 0.9);
  }
  pl.look = lerp(pl.look, look, 1 - Math.exp(-dt*10));
  pl.rig.b.head.rotation.y += pl.look;
}
function updatePitcher(dt) {
  const a = pitcher.anim;
  if (pendingThrow) { pendingThrow.t += dt; if (pendingThrow.t >= 0.19) { spawnBall(pendingThrow); pendingThrow = null; } }
  if (a.cur.name === 'pitch' && a.time > 0.66) a.play('p_idle', { fade: 0.3 });
  a.update(dt);
  if (charging) { const tr = Math.sin(performance.now()/40)*0.015*power; pitcher.rig.b.chest.rotation.z += tr; }
}
function updateFloats(dt) {
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.t += dt;
    if (f.owner) { f.owner.rig.b.head.getWorldPosition(f.pos); f.pos.y += 0.45; }
    else f.pos.y += f.rise*dt;
    _tmp.copy(f.pos).project(camera);
    f.el.style.left = (_tmp.x + 1)/2*innerWidth + 'px'; f.el.style.top = (1 - _tmp.y)/2*innerHeight + 'px';
    f.el.style.opacity = _tmp.z > 1 ? 0 : Math.min(1, (f.life - f.t)*4);
    if (f.t >= f.life) { f.el.remove(); floats.splice(i, 1); if (f.owner && f.owner.bubble === f) f.owner.bubble = null; }
  }
  for (let i = dusts.length - 1; i >= 0; i--) {
    const d = dusts[i]; d.t += dt; d.s.position.addScaledVector(d.v, dt); d.v.multiplyScalar(Math.exp(-dt*2));
    d.s.scale.setScalar(d.g*(1 + d.t*1.5)); d.s.material.opacity = Math.max(0, 1 - d.t/d.life)*0.8;
    if (d.t > d.life) { scene.remove(d.s); dusts.splice(i, 1); }
  }
}

const clock = new THREE.Clock();
let boardTimer = 0;
function loop() {
  requestAnimationFrame(loop);
  const rdt = Math.min(0.05, clock.getDelta());
  if (slowT > 0) { slowT -= rdt; timeScale = 0.3; } else timeScale = lerp(timeScale, 1, 1 - Math.exp(-rdt*8));
  const dt = rdt*timeScale;
  if (playing) {
    timeLeft -= rdt; if (timeLeft <= 0) { timeLeft = 0; endGame(); }
    cooldown = Math.max(0, cooldown - dt); if (cooldown <= 0 && !pendingThrow && heldBall) heldBall.visible = true;
    if (charging) { charge += rdt; const c = charge % 2; power = c < 1 ? c : 2 - c; } else if (!pendingThrow) power = 0;
    powerFill.style.width = power*100 + '%';
    document.getElementById('time').textContent = Math.ceil(timeLeft);
    document.getElementById('score').textContent = score;
    document.getElementById('acc').textContent = hits + '/' + throws;
    document.getElementById('combo').textContent = combo;
  } else reticle.style.display = 'none';
  if (pitcher) { updatePitcher(dt); updateBalls(dt); for (const p of players) updatePlayer(p, dt); }
  updateFloats(dt);
  if ((boardTimer -= rdt) < 0 || boardDirty) { boardTimer = 0.25; drawBoard(); }
  cheerT = Math.max(0, cheerT - rdt);
  const tnow = performance.now()/1000;
  crowdTextures.forEach((t, i) => { t.offset.y = cheerT > 0 ? Math.abs(Math.sin(tnow*14 + i*1.7))*0.06*Math.min(1, cheerT) : 0; });
  if (comboTimer > 0 && (comboTimer -= rdt) <= 0) comboEl.style.opacity = 0;
  camera.position.copy(CAM_BASE); camera.lookAt(CAM_LOOK);
  if (shakeT > 0) { shakeT -= rdt; camera.position.x += rand(-0.04, 0.04); camera.position.y += rand(-0.04, 0.04); }
  effect.render(scene, camera);
}
showStart();
loop();
window.__g = { get p() { return players; }, get b() { return balls; }, camera, CAM_BASE, CAM_LOOK, get pitcher() { return pitcher; }, V3 };
</script>
<script>
window.addEventListener('error', e => { const o = document.getElementById('overlay'); if (o && o.textContent.includes('불러오는 중')) o.innerHTML = '<div class="card"><h1>불러오기 실패</h1><p>' + (e.message || '') + '</p></div>'; });
</script>
</body>
